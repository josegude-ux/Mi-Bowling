<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../auth-lab.css">
<title>MI BOWLING LAB · Test de autenticación ficticia</title>
</head>
<body class="auth-stage">
<div class="auth-lab-flag">🧪 PRUEBA AUTOMÁTICA · Usuario ficticio, sin ninguna conexión externa</div>
<div id="auth-gate"></div>
<script src="../auth-supabase-adapter.js"></script>
<script src="../auth-private-repository.js"></script>
<script src="../auth-lab.js"></script>
<script>
(function(){
 'use strict';
 const A='11111111-1111-4111-8111-111111111111';
 const B='22222222-2222-4222-8222-222222222222';
 let activeUser=A,networkOK=true,signouts=0;
 const client={
  auth:{
   async signInWithPassword({email,password}){
    if(email==='a@example.test'&&password==='Prueba12345678')return {data:{session:{access_token:'simulada'}},error:null};
    return {data:null,error:{message:'Invalid credentials'}};
   },
   async getUser(){
    if(!networkOK)return {data:null,error:{message:'Network offline'}};
    return {data:{user:{id:activeUser,email:'a@example.test',email_confirmed_at:'2026-11-08T00:00:00Z'}},error:null};
   },
   async signUp(){throw Error('El LAB no crea cuentas')},
   async resend(){throw Error('El LAB no envía correos reales')},
   async signOut(){signouts++;return {error:null}},
   async resetPasswordForEmail(){return {data:{},error:null}},
   async updateUser(){return {data:{},error:null}},
   onAuthStateChange(){return {data:{subscription:{unsubscribe(){}}}}}
  },
  from(table){
   if(table!=='bowling_player_documents')throw Error('Tabla incorrecta');
   return {select(fields){
    if(fields!=='user_id,doc_type,payload,revision')throw Error('Consulta insegura');
    return {eq(key,owner){
     if(key!=='user_id')throw Error('Falta filtrar propietario');
     return Promise.resolve({data:[
      {user_id:owner,doc_type:'personal',payload:{version:2,sessions:[],balls:[]},revision:0},
      {user_id:owner,doc_type:'league',payload:{version:1,matches:[]},revision:0}
     ],error:null});
    }}
   }};
  }
 };
 const auth=MiBowlingSupabaseAuth.create(client);
 const repo=MiBowlingPrivateRepository.create(client);
 let launched=0;
 const gate=MiBowlingAuthGate.create({
  auth,repository:repo,
  document,
  onReady:async({user,documents})=>{
   if(user.id!==documents.owner)throw Error('El propietario no coincide');
   launched++;
  }
 });
 gate.init();
 async function run(){
  try{
   if(!document.querySelector('#auth-form'))throw Error('Login ausente');
   if(document.querySelector('#auth-form button[type="submit"]').disabled)throw Error('Proveedor simulado no activo');
   if(document.documentElement.scrollWidth>innerWidth+3)throw Error('Desbordamiento horizontal');
   await gate.login('a@example.test','Prueba12345678');
   if(gate.getState().owner!==A||gate.getState().opened!==true||launched!==1)throw Error('Acceso simulado no validado');
   await gate.logout();
   if(gate.getState().opened||gate.getState().verified)throw Error('Datos visibles tras cierre');
   networkOK=false;
   let blocked=false;
   try{await gate.login('a@example.test','Prueba12345678')}catch(e){blocked=true}
   if(!blocked||launched!==1||gate.getState().verified)throw Error('Entró sin servidor');
   networkOK=true;
   activeUser=B;
   await gate.login('a@example.test','Prueba12345678');
   if(gate.getState().owner!==B||launched!==2)throw Error('Sesión B no separada');
   await gate.logout();
   if(!signouts)throw Error('No se cerró la sesión');
   if(document.querySelector('script[src*="app.js"]'))throw Error('Se ha cargado la app sin almacén');
   document.body.dataset.authMockTest='PASS';
  }catch(e){document.body.dataset.authMockTest='FAIL';document.body.dataset.authMockError=String(e&&e.stack||e);console.error(e)}
 }
 run();
})();
</script>
</body></html>

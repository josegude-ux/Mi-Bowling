<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../line-editor.css">
<title>MI BOWLING · Prueba de editor en navegador</title>
<style>body{padding:10px!important;min-height:100vh}.fixture{max-width:950px;margin:auto}.fixture h1{font-size:20px}</style>
</head><body><main class="fixture"><h1>Editor de línea LAB</h1><div id="fixture-root"></div></main>
<script src="../line-editor.js"></script>
<script>
const recorded={};
window.changeLine=(k,v)=>{recorded[k]=v;};
try{
  const editor=window.MiBowlingLineEditor;
  document.querySelector('#fixture-root').innerHTML=editor.html({approach:'25',arrow:'15',breakpoint:'8',breakpointFt:'43'});
  editor.refresh();
  const lane=document.querySelector('#shot-lane'),marker=lane?.querySelector('[data-point="approach"]');
  if(!lane||!marker)throw Error('No aparece pista o marcador');
  if(lane.getBoundingClientRect().width>window.innerWidth)throw Error('La pista rebasa la ventana');
  if(document.documentElement.scrollWidth>window.innerWidth+2)throw Error('Desbordamiento horizontal');
  const rect=lane.getBoundingClientRect(),at=(x,y)=>({x:rect.left+x*rect.width/380,y:rect.top+y*rect.height/644});
  const a=at(editor.boardX(28),601);
  marker.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerId:7,clientX:a.x,clientY:a.y}));
  document.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,pointerId:7,clientX:a.x,clientY:a.y}));
  document.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerId:7,clientX:a.x,clientY:a.y}));
  if(document.getElementById('approach').value!=='28')throw Error('No se actualiza el punto al arrastrar');
  if(recorded.approach!=='28')throw Error('No se guarda la posición de pies');
  const bpFt=document.getElementById('breakpointFt');
  bpFt.value='45';bpFt.dispatchEvent(new Event('input',{bubbles:true}));
  if(recorded.breakpointFt!=='45')throw Error('No se actualiza distancia');
  if(lane.querySelectorAll('.shot-marker').length!==3)throw Error('No aparecen los tres marcadores');
  document.body.dataset.result='PASS';
  document.body.dataset.browserWidth=window.innerWidth;
}catch(err){document.body.dataset.result='FAIL';document.body.dataset.error=String(err&&err.stack||err);console.error(err)}
</script></body></html>

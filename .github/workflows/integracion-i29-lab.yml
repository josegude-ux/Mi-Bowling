name: MI BOWLING · LAB I29 · Session isolation and external I25 verification
on:
  push:
    branches:
      - feature/integracion-main-auth-i29-lab-20261110
  pull_request:
    branches:
      - feature/integracion-main-auth-i28-lab-20261110
    paths:
      - 'lab/i29-*'
      - 'lab/integracion-main-auth-i29.html'
      - 'tests/i29-*'
      - 'docs/INTEGRACION_MAIN_CP020_I29_SESSION_ISOLATION_LAB_20261110.md'
      - '.github/workflows/integracion-i29-lab.yml'
permissions:
  contents: read
jobs:
  node_validation:
    name: I29 Node · FGB CP020 + I11-I29 concurrency, external verification and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis I29 y contratos
        run: |
          node --check lab/i29-session-guard.js
          node --check lab/i29-ui.js
          node --check tests/i29-session-fixture.cjs
          node --check tests/i29-session-contract.test.cjs
          node --check tests/i29-session-browser.test.cjs
      - name: FGB CP-020 y calendario oficial sin alteraciones
        run: |
          node tests/integracion-main-auth-cp020-contract.test.cjs
          node tests/official-calendar-smoke.cjs
      - name: Regresiones I11-I28 preservadas
        run: |
          node tests/i11-audit-contract.test.cjs
          node tests/i12-manifest-contract.test.cjs
          node tests/i13-witness-contract.test.cjs
          node tests/i14-lifecycle-contract.test.cjs
          node tests/i15-recovery-contract.test.cjs
          node tests/i16-anchor-contract.test.cjs
          node tests/i17-forensics-contract.test.cjs
          node tests/i18-forensic-contract.test.cjs
          node tests/i19-review-contract.test.cjs
          node tests/i20-rival-contract.test.cjs
          node tests/i21-provenance-contract.test.cjs
          node tests/i22-uncertainty-contract.test.cjs
          node tests/i23-external-evidence-contract.test.cjs
          node tests/i24-manual-crosscheck-contract.test.cjs
          node tests/i25-retention-contract.test.cjs
          node tests/i26-bounded-import-contract.test.cjs
          node tests/i27-resource-contract.test.cjs
          node tests/i28-efficiency-contract.test.cjs
      - name: I29 · independent sessions, cancellation and original external I25.verify
        run: node tests/i29-session-contract.test.cjs
  browser:
    name: I29 · WebKit emulated Linux mobile and Chromium desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright LAB only
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.65.0
      - name: WebKit Linux emulated setup
        run: ./node_modules/.bin/playwright install --with-deps webkit
      - name: A/B/C fictitious isolated HTTPS local browser regressions
        run: |
          node tests/i28-efficiency-browser.test.cjs
          node tests/i29-session-browser.test.cjs

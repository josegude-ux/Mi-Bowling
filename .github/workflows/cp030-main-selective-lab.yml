name: MI BOWLING | MI BOWLING | CP031 3.3.13-prueba candidata (ficticios)
on:
  push:
    branches: [release/mi-bowling-3.3.13-prueba-20261122]
    paths:
      - .github/workflows/cp030-main-selective-lab.yml
      - tests/cp030-retired-lab.cjs
      - tests/cp030-retired-browser-lab.cjs
      - releases/catalogo-local-f1-fotos1/app.js
      - sw.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-cp030-tests:
    if: github.repository == 'josegude-ux/Mi-Bowling' && github.ref == 'refs/heads/release/mi-bowling-3.3.13-prueba-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Static source, new synthetic fixture and 60/60 PWA hashes
        run: |
          node --check tests/cp030-retired-lab.cjs
          node --check tests/cp030-retired-browser-lab.cjs
          node --check releases/catalogo-local-f1-fotos1/app.js
          node tests/cp030-retired-lab.cjs
      - name: Install isolated Chromium runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Only new CP030 real browser case, fictitious records on localhost
        run: node tests/cp030-retired-browser-lab.cjs

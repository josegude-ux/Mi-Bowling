name: MI BOWLING | LAB Plantilla 100 Bolas
on:
  push:
    branches: [feature/plantilla-catalogo100-20261110]
  pull_request:
    branches: [main]
    paths:
      - catalogo-bolas/**
      - tests/catalogo100.cjs
      - .github/workflows/catalogo100-lab.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Validar esquema, contenido, seguridad y sintaxis
        run: node tests/catalogo100.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Instalar dependencias efímeras del runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 pdf-lib@1.17.1 pdfjs-dist@3.11.174
          npx playwright install --with-deps chromium webkit
      - name: Probar selector e importación de PDF sintético
        run: node tests/catalogo100.cjs --browser
      - name: Subir capturas del LAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi-bowling-catalogo100-capturas-lab
          path: catalogo100-*.png
          if-no-files-found: ignore
          retention-days: 7

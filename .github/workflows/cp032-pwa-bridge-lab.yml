name: MI BOWLING | CP032 PWA bridge LAB end-to-end (new only)
on:
  push:
    branches: [lab/cp032-registro-compacto-v3-20261122]
    paths:
      - .github/workflows/cp032-pwa-bridge-lab.yml
      - tests/cp032-pwa-bridge-browser.cjs
      - index.html
      - sw.js
      - lab/registro-cp021/cp021-entry.js
      - lab/cp032-v3-journal.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cp032-new-pwa-integration:
    if: github.repository == 'josegude-ux/Mi-Bowling' && github.ref == 'refs/heads/lab/cp032-registro-compacto-v3-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax check new isolated PWA fixture adapter and tests
        run: |
          node --check lab/cp032-pwa-adapter.js
          node --check lab/cp032-fixture.js
          node --check lab/cp032-v3-journal.js
          node --check lab/registro-cp021/cp021-entry.js
          node --check tests/cp032-pwa-bridge-browser.cjs
      - name: Install temporary Chromium only on isolated runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Only NEW PWA v2/v3 full synthetic integration case, single viewport
        run: node tests/cp032-pwa-bridge-browser.cjs

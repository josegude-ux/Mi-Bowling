name: MI BOWLING · LAB I27 · Perfilado reproducible sin falsa custodia
on:
  push:
    branches:
      - feature/integracion-main-auth-i27-lab-20261110
  pull_request:
    paths:
      - 'lab/i27-*'
      - 'lab/integracion-main-auth-i27.html'
      - 'tests/i27-*'
      - '.github/workflows/integracion-i27-lab.yml'
permissions:
  contents: read
jobs:
  node_validation:
    name: I27 Node · FGB CP020 I11-I27 budget and heap observations
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis I27
        run: |
          node --check lab/i27-resource-profile.js
          node --check lab/i27-ui.js
          node --check tests/i27-resource-fixture.cjs
          node --check tests/i27-resource-contract.test.cjs
          node --check tests/i27-resource-browser.test.cjs
      - name: CP-020 y calendario FGB intactos
        run: |
          node tests/integracion-main-auth-cp020-contract.test.cjs
          node tests/official-calendar-smoke.cjs
      - name: Regresiones I11-I26 sin alterar
        run: |
          node tests/i11-audit-contract.test.cjs
          node tests/i12-manifest-contract.test.cjs
          node tests/i13-witness-contract.test.cjs
          node tests/i14-lifecycle-contract.test.cjs
          node tests/i15-recovery-contract.test.cjs
          node tests/i16-anchor-contract.test.cjs
          node tests/i17-forensics-contract.test.cjs
          node tests/i18-forensic-contract.test.cjs
          node tests/i19-review-contract.test.cjs
          node tests/i20-rival-contract.test.cjs
          node tests/i21-provenance-contract.test.cjs
          node tests/i22-uncertainty-contract.test.cjs
          node tests/i23-external-evidence-contract.test.cjs
          node tests/i24-manual-crosscheck-contract.test.cjs
          node tests/i25-retention-contract.test.cjs
          node tests/i26-bounded-import-contract.test.cjs
      - name: I27 · Monotonic elapsed, sampled heapUsed and pressure failure
        run: node tests/i27-resource-contract.test.cjs
  browser:
    name: I27 · WebKit Chromium · realistic limits, no fabricated RAM
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright solo LAB
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.65.0
      - name: WebKit móvil Linux emulado
        run: ./node_modules/.bin/playwright install --with-deps webkit
      - name: A/B/C ficticios HTTPS localhost y bloqueo de red exterior
        run: node tests/i27-resource-browser.test.cjs

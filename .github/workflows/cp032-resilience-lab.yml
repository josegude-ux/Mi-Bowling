name: MI BOWLING | CP032 quota, corruption and boot LAB
on:
  push:
    branches: [lab/cp032-registro-compacto-v3-20261122]
    paths:
      - .github/workflows/cp032-resilience-lab.yml
      - lab/cp032-boot-guard.js
      - lab/cp032-resilience-harness.html
      - tests/cp032-resilience-browser.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cp032-only-new-resilience:
    if: github.repository == 'josegude-ux/Mi-Bowling' && github.ref == 'refs/heads/lab/cp032-registro-compacto-v3-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax check of only new CP032 boot resilience code
        run: |
          node --check lab/cp032-boot-guard.js
          node --check tests/cp032-resilience-browser.cjs
      - name: Install disposable Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: New synthetic quota, corrupt-journal and boot recovery tests only
        run: node tests/cp032-resilience-browser.cjs

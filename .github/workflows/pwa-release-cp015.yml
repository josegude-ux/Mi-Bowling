name: MI BOWLING | CP017 macOS HTTPS guard
on:
  push:
    branches: [lab/pwa-release-cp015-20261113]
    paths:
      - '.github/workflows/pwa-release-cp015.yml'
      - 'lab/pwa-release-cp015/**'
permissions:
  contents: read
jobs:
  guard-macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: WebKit real cache guard in private HTTPS loopback (synthetic data only)
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d16b941a5889b52b1cd2b4bfb51e99b10b25887a HEAD
          git diff --exit-code d16b941a5889b52b1cd2b4bfb51e99b10b25887a HEAD -- app.js index.html sw.js catalogo-bolas/index.html
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install webkit
          export CP017_TLS_DIR="$(mktemp -d)"
          cd "$CP017_TLS_DIR"
          trap 'if [ -f ca.pem ]; then sudo security delete-certificate -Z "$(openssl x509 -in ca.pem -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)" /Library/Keychains/System.keychain || true; fi; rm -rf "$CP017_TLS_DIR"' EXIT
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          "$OPENSSL" version
          cat > ca.cnf <<'EOF'
          [req]
          distinguished_name=dn
          x509_extensions=ca_ext
          prompt=no
          [dn]
          CN=CP017 Local Ephemeral CA
          [ca_ext]
          basicConstraints=critical,CA:TRUE
          keyUsage=critical,keyCertSign,cRLSign
          subjectKeyIdentifier=hash
          EOF
          "$OPENSSL" req -x509 -newkey rsa:2048 -nodes -days 1 -sha256 -config ca.cnf -keyout ca.key -out ca.pem
          "$OPENSSL" req -newkey rsa:2048 -nodes -sha256 -keyout leaf.key -out leaf.csr -subj '/CN=localhost'
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\nkeyUsage=digitalSignature,keyEncipherment\nsubjectKeyIdentifier=hash\nauthorityKeyIdentifier=keyid,issuer\n' > leaf.ext
          "$OPENSSL" x509 -req -in leaf.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out leaf.pem -days 1 -extfile leaf.ext -sha256
          "$OPENSSL" verify -CAfile ca.pem -verify_hostname localhost leaf.pem
          sudo security add-trusted-cert -d -r trustRoot -p ssl -k /Library/Keychains/System.keychain ca.pem
          export CP017_SCHEME=https
          if security verify-cert -c leaf.pem -c ca.pem -p ssl -s localhost; then
            echo 'CP017_TLS_SYSTEM_VERIFY PASS'
          else
            echo 'CP017_TLS_SYSTEM_VERIFY FAIL: separate loopback HTTP secure-context diagnostic only; no TLS exception'
            export CP017_SCHEME=http
          fi
          cd "$GITHUB_WORKSPACE"
          node lab/pwa-release-cp015/guard-macos-cp017.cjs

name: MI BOWLING · Acceso correo y contraseña · LAB A1
on:
  push:
    branches:
      - feature/auth-correo-lab-20261108
  pull_request:
    paths:
      - auth-lab.js
      - auth-email-callback.js
      - auth-link-boot.js
      - auth/callback.html
      - auth/callback-entry.js
      - docs/email-templates/LAB_A3_confirm_signup_REVIEW_ONLY.html
      - docs/email-templates/LAB_A3_reset_password_REVIEW_ONLY.html
      - tests/auth-callback.test.cjs
      - tests/auth-callback-browser.test.cjs
      - auth-supabase-adapter.js
      - auth-private-repository.js
      - auth-boot.js
      - auth-lab.css
      - index.html
      - tests/auth-lab.test.cjs
      - tests/auth-email-flows.test.cjs
      - tests/auth-browser-mock.html
      - tests/auth-browser-smoke.cjs
      - .github/workflows/auth-correo-lab.yml
permissions:
  contents: read
jobs:
  auth-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis y contrato de acceso seguro
        run: |
          node --check auth-lab.js
          node --check auth-email-callback.js
          node --check auth-link-boot.js
          node --check auth/callback-entry.js
          node --check auth-supabase-adapter.js
          node --check auth-private-repository.js
          node --check auth-boot.js
          node --check tests/auth-lab.test.cjs
          node --check tests/auth-callback.test.cjs
          node tests/auth-callback.test.cjs
          node --check tests/auth-email-flows.test.cjs
          node --check tests/auth-browser-smoke.cjs
          node --check tests/auth-callback-browser.test.cjs
          node tests/auth-lab.test.cjs
          node tests/auth-email-flows.test.cjs
      - name: Formulario responsive y acceso bloqueado sin backend
        run: |
          node tests/auth-browser-smoke.cjs
          node tests/auth-callback-browser.test.cjs
        run: |
          node tests/auth-browser-smoke.cjs
          node tests/auth-callback-browser.test.cjs
      - name: Capturas callback A3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi-bowling-auth-callback-lab
          path: tests/artifacts-callback/*.png
          retention-days: 14
          if-no-files-found: warn

name: MI BOWLING | CP003 CSS optimization isolated homologation
on:
  push:
    branches: [ui/mis-bolas-compacto-20261116]
    paths:
      - .github/workflows/mis-bolas-compacto-cp003.yml
      - tests/mis-bolas-compacto-cp003.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    if: github.repository == 'josegude-ux/Mi-Bowling' && github.ref == 'refs/heads/ui/mis-bolas-compacto-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Static gate first (no browser downloads if source or gzip fails)
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          node --check tests/mis-bolas-compacto-cp003.cjs
          node tests/mis-bolas-compacto-cp003.cjs --static-only
      - name: Install ephemeral browser for integrated checks
        run: npx playwright install --with-deps chromium
      - name: New CP003 browser checks (fake data, isolated origin)
        run: node tests/mis-bolas-compacto-cp003.cjs

name: MI BOWLING | Catalogo100 integracion CP001 pruebas afectadas
on:
  push:
    branches: [lab/catalog100-integracion-20261115]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            os: ubuntu-24.04
          - engine: webkit
            os: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct exact code-only candidate on base
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/catalog-integration-browser"
          git archive 19fc0a8d3644d99ccdafdb4779e3b22be26ef827 | tar -x -C "$RUNNER_TEMP/catalog-integration-browser"
          python3 -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('lab/catalog-integration/code-only-lab.zip').read_bytes()).hexdigest()=='a37d4cdb1397ec414f5f7d8746e5fde96e73d86a10b5cbd3b0cf8faa6a7230b4'"
          unzip -oq lab/catalog-integration/code-only-lab.zip -d "$RUNNER_TEMP/catalog-integration-browser"
          node --check "$RUNNER_TEMP/catalog-integration-browser/releases/catalog100-integracion-cp001/app.js"
      - name: Standard test browsers
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          python3 -m venv "$RUNNER_TEMP/catalog-venv"
          "$RUNNER_TEMP/catalog-venv/bin/pip" install --disable-pip-version-check playwright==1.56.0
          if [ "$RUNNER_OS" = Linux ]; then "$RUNNER_TEMP/catalog-venv/bin/python" -m playwright install --with-deps "$ENGINE"; else "$RUNNER_TEMP/catalog-venv/bin/python" -m playwright install "$ENGINE"; fi
      - name: Only new integration with synthetic photo adapter and data
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          export EXPECTED_APP=$(python3 -c "import hashlib,pathlib,os;print(hashlib.sha256((pathlib.Path(os.environ['RUNNER_TEMP'])/'catalog-integration-browser/releases/catalog100-integracion-cp001/app.js').read_bytes()).hexdigest())")
          "$RUNNER_TEMP/catalog-venv/bin/python" -u lab/catalog-integration/browser.py "$ENGINE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-integration-${{ matrix.engine }}-synthetic-screens
          path: ${{ runner.temp }}/catalog-integration-browser/catalog-*.png
          if-no-files-found: ignore
          retention-days: 3

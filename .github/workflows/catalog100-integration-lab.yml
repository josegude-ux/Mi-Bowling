name: MI BOWLING | Catalogo 100 integracion LAB
on:
  push:
    branches: [lab/catalog100-integracion-20261115]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive public source at exact commits, without private photos or user data
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery/base" "$RUNNER_TEMP/recovery/pr53" "$RUNNER_TEMP/recovery/pr58"
          git archive 19fc0a8d3644d99ccdafdb4779e3b22be26ef827 | tar -x -C "$RUNNER_TEMP/recovery/base"
          git archive 550b635cccf470edc5ee4fda3cba54b41ab02ead catalogo-bolas/enrichment20.js catalogo-bolas/AUDITORIA-FICHAS-20-004.md catalogo-bolas/PROCEDIMIENTO-PERMISOS-IMAGENES.md | tar -x -C "$RUNNER_TEMP/recovery/pr53"
          git archive 859a25960e99a1ee7a9dbf82f117dee5bc66f48e app.js arsenal-view-lab.js catalogo100-mis-bolas-bridge.js catalogo100-variant-policy.js tests/catalogo100-arsenal-bridge-lab.cjs tests/catalogo100-variant-review-lab.cjs | tar -x -C "$RUNNER_TEMP/recovery/pr58"
          git ls-tree -r 19fc0a8d3644d99ccdafdb4779e3b22be26ef827 > "$RUNNER_TEMP/recovery/base-git-tree.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: catalog100-exact-public-source
          path: ${{ runner.temp }}/recovery
          include-hidden-files: true
          retention-days: 3

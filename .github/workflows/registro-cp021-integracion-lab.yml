name: MI BOWLING | CP021 integrated PWA synthetic smoke
on:
  push:
    branches: [ui/mis-bolas-compacto-20261116]
    paths:
      - .github/workflows/registro-cp021-integracion-lab.yml
      - tests/registro-cp021-integration-browser.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    if: github.repository == 'josegude-ux/Mi-Bowling' && github.ref == 'refs/heads/ui/mis-bolas-compacto-20261116'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated runtime only
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          node --check tests/registro-cp021-integration-browser.cjs
      - name: Verify NEW CP021 integrated view on synthetic localhost
        run: node tests/registro-cp021-integration-browser.cjs

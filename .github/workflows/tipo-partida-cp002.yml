name: MI BOWLING | Tipo partida CP004 visual rollback Safari
on:
  push:
    branches: [lab/tipo-partida-20261114]
    paths: ['lab/tipo-partida/**', '.github/workflows/tipo-partida-cp002.yml']
permissions:
  contents: read
jobs:
  browser:
    name: Tipo partida real ${{ matrix.engine }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            os: ubuntu-24.04
          - engine: safari-native
            os: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact CP001 and original main
        run: |
          set -euo pipefail
          git diff --exit-code d16b941a5889b52b1cd2b4bfb51e99b10b25887a HEAD -- app.js index.html sw.js
          mkdir -p "$RUNNER_TEMP/tipo-base" "$RUNNER_TEMP/tipo-cp001"
          git archive d16b941a5889b52b1cd2b4bfb51e99b10b25887a | tar -x -C "$RUNNER_TEMP/tipo-base"
          test "$(git hash-object "$RUNNER_TEMP/tipo-base/app.js")" = e653869f2def6cedba563c7c46529de8ef2bbe9e
          python3 -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('lab/tipo-partida/cp001.zip').read_bytes()).hexdigest()=='f84a7927ebbfcbb0fe6a962de59822d9ac8886fa6e9b005ee50c8726f77096cb'"
          unzip -q lab/tipo-partida/cp001.zip -d "$RUNNER_TEMP/tipo-cp001"
          cd "$RUNNER_TEMP/tipo-cp001"
          python3 -c "import hashlib,pathlib; h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest(); assert h('manifest.sha256')=='1845ac1052e968c75bb5acc285ade8ab5fc26750536c04d07d26e3bba0e3bd40'; assert all(h(n)==s for s,n in (l.split(maxsplit=1) for l in pathlib.Path('manifest.sha256').read_text().splitlines())); print('CP001 manifest verified')" 
          cd "$RUNNER_TEMP/tipo-base"
          patch -f -p1 < "$RUNNER_TEMP/tipo-cp001/change-type.patch"
          cmp app.js "$RUNNER_TEMP/tipo-cp001/app.js"
          cd "$GITHUB_WORKSPACE"
          python3 lab/tipo-partida/apply-cp002.py
          python3 lab/tipo-partida/build-cp003.py
          python3 lab/tipo-partida/build-cp004.py
          python3 lab/tipo-partida/build-rollback-production.py
      - name: Browser prerequisites
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tipo-venv"
          PY="$RUNNER_TEMP/tipo-venv/bin/python"
          if [ "$ENGINE" = safari-native ]; then
            test -x /usr/bin/safaridriver
            /usr/bin/safaridriver --version
            "$PY" -m pip install --disable-pip-version-check selenium==4.38.0
            "$PY" -c 'import subprocess; subprocess.run(["sudo","-n","/usr/bin/safaridriver","--enable"],check=True,timeout=30)'
          else
            "$PY" -m pip install --disable-pip-version-check playwright==1.56.0
            if [ "$RUNNER_OS" = Linux ]; then "$PY" -m playwright install --with-deps "$ENGINE"; else "$PY" -m playwright install "$ENGINE"; fi
          fi
      - name: New affected scenarios only
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/tipo-venv/bin/python"
          if [ "$ENGINE" = safari-native ]; then
            "$PY" -u lab/tipo-partida/native-production-transition.py
          elif [ "$ENGINE" = chromium ]; then
            "$PY" -u lab/tipo-partida/browser-production-transition.py "$ENGINE" rollback
          else
            "$PY" -u lab/tipo-partida/browser-cp004.py "$ENGINE" visual
          fi

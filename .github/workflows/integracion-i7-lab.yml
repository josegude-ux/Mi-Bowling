name: MI BOWLING · LAB I7 · WAL cifrado por pestaña y operación
on:
  push:
    branches:
      - feature/integracion-main-auth-i7-lab-20261109
  pull_request:
    paths:
      - 'lab/i7-*'
      - 'lab/integracion-main-auth-i7*'
      - 'tests/integracion-i7-*'
      - 'tests/i7-*'
      - '.github/workflows/integracion-i7-lab.yml'
permissions:
  contents: read
jobs:
  contract:
    name: I7 · integridad de CP-020, FGB y contratos previos
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar activos publicados y calendario
        run: |
          node tests/integracion-main-auth-cp020-contract.test.cjs
          node tests/official-calendar-smoke.cjs
      - name: Comprobar sintaxis nueva I7
        run: |
          node --check lab/i7-encrypted-store.js
          node --check lab/i7-persistence.js
          node --check lab/i7-guard.js
          node --check lab/integracion-main-auth-i7.js
          node --check tests/integracion-i7-browser.test.cjs
          node --check tests/i7-multi-wal-browser.test.cjs
          node --check tests/i7-multi-wal-contract.test.cjs
      - name: Contratos propios de journal I7 antes de red simulada
        run: node tests/i7-multi-wal-contract.test.cjs
      - name: Regresiones de contratos anteriores independientes
        run: |
          node tests/integracion-i4-journal.test.cjs
          node tests/score-sync-i3.test.cjs
          node tests/auth-three-users-rls-a5.test.cjs
          node tests/stats-bolos.test.cjs
  browser:
    name: "I7 · WebKit y Chromium: WAL multi-pestaña, cifrado y recuperación"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright aislado
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.65.0
      - name: Instalar navegador WebKit Linux emulado
        run: ./node_modules/.bin/playwright install --with-deps webkit
      - name: Motor CP-020 con nuevo journal por operación
        run: node tests/integracion-i7-browser.test.cjs
      - name: Fallos y concurrencia del multi-WAL con cierres reales
        run: node tests/i7-multi-wal-browser.test.cjs
      - name: Capturas de LAB con puntuaciones ficticias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi-bowling-i7-multi-wal-lab
          path: tests/artifacts-integracion-i7/*.png
          retention-days: 14
          if-no-files-found: warn

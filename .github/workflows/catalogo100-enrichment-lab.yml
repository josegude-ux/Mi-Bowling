name: "MI BOWLING | LAB 20 fichas + PDF USBC real"
on:
  push:
    branches: [lab/catalogo100-fichas-usbc-real-20261110]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Sintaxis y contratos independientes
        run: |
          node --check catalogo-bolas/enrichment20.js
          node --check tests/catalogo100-enrich20-lab.cjs
          node tests/catalogo100-enrich20-lab.cjs
          node tests/catalogo100.cjs
          node tests/home-clean-lab.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Instalar navegadores y lectores PDF efímeros
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 pdf-lib@1.17.1 pdfjs-dist@3.11.174
          npx playwright install --with-deps chromium webkit
      - name: Descargar PDF oficial al runner para prueba, sin distribuirlo
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 95 --connect-timeout 15 -sS \
            -A 'Mozilla/5.0 (compatible; MI-BOWLING-validation/1.0)' \
            'https://bowl.com/getmedia/8b570e80-761c-4486-8628-9d50d718dd60/approved_balllist_CURRENT.pdf' \
            -o "$RUNNER_TEMP/usbc.pdf"
          test "$(head -c5 "$RUNNER_TEMP/usbc.pdf")" = '%PDF-'
      - name: Validar extracción independiente y fuente
        run: node tests/catalogo100-usbc-pdf-real-lab.cjs "$RUNNER_TEMP/usbc.pdf"
      - name: Probar primeras veinte + importación USBC real en navegador (Chrome/WebKit)
        run: node tests/catalogo100-enrich20-lab.cjs --browser "$RUNNER_TEMP/usbc.pdf"
      - name: Regresiones de catálogo original con PDF sintético
        run: node tests/catalogo100.cjs --browser
      - name: Borrar PDF temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/usbc.pdf"

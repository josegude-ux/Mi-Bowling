name: MI BOWLING | CP032 registro compacto v3 LAB (ficticios)
on:
  push:
    branches: [lab/cp032-registro-compacto-v3-20261122]
    paths:
      - .github/workflows/cp032-registro-lab.yml
      - lab/registro-cp021/**
      - lab/cp032-contract-v3.js
      - tests/cp032-contract.cjs
      - tests/cp032-browser.cjs
      - index.html
      - sw.js
      - releases/catalogo-local-f1-fotos1/app.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cp032-only-new-tests:
    if: github.repository == 'josegude-ux/Mi-Bowling' && github.ref == 'refs/heads/lab/cp032-registro-compacto-v3-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: New v2/v3 semantic and CP032 resource contract tests
        run: |
          node --check releases/catalogo-local-f1-fotos1/app.js
          node --check lab/cp032-contract-v3.js
          node --check tests/cp032-contract.cjs
          node --check tests/cp032-browser.cjs
          node tests/cp032-contract.cjs
      - name: Temporary Chromium on isolated runner (no deployment)
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: PWA shell + five simulated iPhone viewport checks, only fictitious data
        run: node tests/cp032-browser.cjs

name: MI BOWLING | CP032 v3 journal/history LAB (ficticios)
on:
  push:
    branches: [lab/cp032-registro-compacto-v3-20261122]
    paths:
      - .github/workflows/cp032-registro-lab.yml
      - lab/registro-cp021/cp021-entry.js
      - lab/cp032-history-stats.js
      - lab/cp032-v3-journal.js
      - tests/cp032-history-stats.cjs
      - tests/cp032-journal-browser.cjs
      - index.html
      - sw.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cp032-new-journal-tests-only:
    if: github.repository == 'josegude-ux/Mi-Bowling' && github.ref == 'refs/heads/lab/cp032-registro-compacto-v3-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: NEW CP032 precision-aware history + transactional journal syntax
        run: |
          node --check lab/cp032-history-stats.js
          node --check lab/cp032-v3-journal.js
          node --check tests/cp032-history-stats.cjs
          node --check tests/cp032-journal-browser.cjs
          node tests/cp032-history-stats.cjs
      - name: Temporary isolated Chromium runner; no deployment
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: NEW CP032 IDB journal recovery and exact statistics in one viewport (no repeat of 5 sizes)
        run: node tests/cp032-journal-browser.cjs

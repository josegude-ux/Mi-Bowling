name: MI BOWLING · LAB I24 · Contraste manual sin falsa custodia
on:
  push:
    branches:
      - feature/integracion-main-auth-i24-lab-20261109
  pull_request:
    paths:
      - 'lab/i24-*'
      - 'lab/integracion-main-auth-i24.html'
      - 'tests/i24-*'
      - '.github/workflows/integracion-i24-lab.yml'
permissions:
  contents: read
jobs:
  node_validation:
    name: I24 Node · CP020 FGB I11-I24 six-axis independent evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis I24
        run: |
          node --check lab/i24-manual-crosscheck.js
          node --check lab/i24-ui.js
          node --check tests/i24-manual-crosscheck-fixture.cjs
          node --check tests/i24-manual-crosscheck-contract.test.cjs
          node --check tests/i24-manual-crosscheck-browser.test.cjs
      - name: Contratos CP-020 y calendario FGB
        run: |
          node tests/integracion-main-auth-cp020-contract.test.cjs
          node tests/official-calendar-smoke.cjs
      - name: Regresiones LAB I11-I23
        run: |
          node tests/i11-audit-contract.test.cjs
          node tests/i12-manifest-contract.test.cjs
          node tests/i13-witness-contract.test.cjs
          node tests/i14-lifecycle-contract.test.cjs
          node tests/i15-recovery-contract.test.cjs
          node tests/i16-anchor-contract.test.cjs
          node tests/i17-forensics-contract.test.cjs
          node tests/i18-forensic-contract.test.cjs
          node tests/i19-review-contract.test.cjs
          node tests/i20-rival-contract.test.cjs
          node tests/i21-provenance-contract.test.cjs
          node tests/i22-uncertainty-contract.test.cjs
          node tests/i23-external-evidence-contract.test.cjs
      - name: I24 · Matriz manual y criterios externos no acreditados
        run: node tests/i24-manual-crosscheck-contract.test.cjs
  browser:
    name: I24 · WebKit Chromium · manual six-axis review without authority
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright solo LAB
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.65.0
      - name: WebKit Linux móvil emulado
        run: ./node_modules/.bin/playwright install --with-deps webkit
      - name: A/B/C ficticios en HTTPS localhost bloqueando red externa
        run: node tests/i24-manual-crosscheck-browser.test.cjs

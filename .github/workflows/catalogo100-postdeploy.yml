name: MI BOWLING | Auditoría web pública Catálogo 100
on:
  push:
    branches: [audit/catalogo100-pages-20261110]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  page:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Preparar navegador aislado
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Auditar página pública sin datos del usuario
        run: node tests/catalogo100-published.cjs
      - name: Conservar capturas postpublicación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bowling-catalogo100-postpublicacion
          path: catalogo100-live-*.png
          if-no-files-found: ignore
          retention-days: 7

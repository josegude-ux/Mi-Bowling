name: MI BOWLING | Estadisticas interactivas LAB CP001 mixed v3
on:
  push:
    branches: [lab/estadisticas-interactivas-20261114]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            os: ubuntu-24.04
          - engine: webkit
            os: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact base and reconstruct LAB privately
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stats-lab/base"
          git archive 2f2fd46bad01e75e12ae7b78303f388587a77208 | tar -x -C "$RUNNER_TEMP/stats-lab/base"
          python3 -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('lab/stats/increment.zip').read_bytes()).hexdigest()=='78ab11f1a4179ecf36f30bb374baff383e36994ca801d61c902d4333aa8b0eb8'"
          unzip -q lab/stats/increment.zip -d "$RUNNER_TEMP/stats-lab"
          python3 -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('lab/stats/visual-v2.zip').read_bytes()).hexdigest()=='007d58fe158306129469db085b889efc8e992bbe521e408df00f897307f4ef1f'"
          unzip -oq lab/stats/visual-v2.zip -d "$RUNNER_TEMP/stats-lab"
          python3 -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('lab/stats/mixed-v3.zip').read_bytes()).hexdigest()=='583854d1478add69f0a266df1ce0bf84f5d263ed9fba44e4260cd35a4d0cdef7'"
          unzip -oq lab/stats/mixed-v3.zip -d "$RUNNER_TEMP/stats-lab"
          python3 "$RUNNER_TEMP/stats-lab/build.py"
          python3 -c "import hashlib,pathlib,os; r=pathlib.Path(os.environ['RUNNER_TEMP'])/'stats-lab/candidate'; assert hashlib.sha256((r/'app-stats-interactive-lab.js').read_bytes()).hexdigest()=='e7c15a0f118b5a661439b6ffab3587db5af1ce8057e01f5b1b27a04f8c066e10'; assert hashlib.sha256((r/'stats-interactive-lab.css').read_bytes()).hexdigest()=='7cdeaa768cb79b9c144424e390bd388fd27370a4e03502792ae46f2d419f2d7d'; assert hashlib.sha256((r/'sw.js').read_bytes()).hexdigest()=='969f06c900cd8e764f29cf0c098178b5fe7dd1bf5531cf52e8576d78dd7e53fd'"
      - name: Install test browser on standard runner
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/stats-venv"
          "$RUNNER_TEMP/stats-venv/bin/pip" install --disable-pip-version-check playwright==1.56.0
          if [ "$RUNNER_OS" = Linux ]; then "$RUNNER_TEMP/stats-venv/bin/python" -m playwright install --with-deps "$ENGINE"; else "$RUNNER_TEMP/stats-venv/bin/python" -m playwright install "$ENGINE"; fi
      - name: Mixed-ball streak targeted regression
        env:
          ENGINE: ${{ matrix.engine }}
        run: '"$RUNNER_TEMP/stats-venv/bin/python" -u "$RUNNER_TEMP/stats-lab/mixed.py" "$ENGINE"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stats-cp001-v3-${{ matrix.engine }}-screens
          path: ${{ runner.temp }}/stats-lab/stats-*.png
          if-no-files-found: ignore
          retention-days: 3

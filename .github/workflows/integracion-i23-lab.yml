name: MI BOWLING · LAB I23 · Exigir evidencia externa no atribuida
on:
  push:
    branches:
      - feature/integracion-main-auth-i23-lab-20261109
  pull_request:
    paths:
      - 'lab/i23-*'
      - 'lab/integracion-main-auth-i23.html'
      - 'tests/i23-*'
      - '.github/workflows/integracion-i23-lab.yml'
permissions:
  contents: read
jobs:
  node_validation:
    name: I23 Node · CP020/FGB I11-I23 independent custody requirements
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contratos I23 · sintaxis
        run: |
          node --check lab/i23-external-evidence-gate.js
          node --check lab/i23-ui.js
          node --check tests/i23-external-evidence-fixture.cjs
          node --check tests/i23-external-evidence-contract.test.cjs
          node --check tests/i23-external-evidence-browser.test.cjs
      - name: CP-020 y calendario FGB sin cambios
        run: |
          node tests/integracion-main-auth-cp020-contract.test.cjs
          node tests/official-calendar-smoke.cjs
      - name: Regresiones I11-I22 intactas
        run: |
          node tests/i11-audit-contract.test.cjs
          node tests/i12-manifest-contract.test.cjs
          node tests/i13-witness-contract.test.cjs
          node tests/i14-lifecycle-contract.test.cjs
          node tests/i15-recovery-contract.test.cjs
          node tests/i16-anchor-contract.test.cjs
          node tests/i17-forensics-contract.test.cjs
          node tests/i18-forensic-contract.test.cjs
          node tests/i19-review-contract.test.cjs
          node tests/i20-rival-contract.test.cjs
          node tests/i21-provenance-contract.test.cjs
          node tests/i22-uncertainty-contract.test.cjs
      - name: I23 · Requisitos externos no satisfechos y origen no autenticado
        run: node tests/i23-external-evidence-contract.test.cjs
  browser:
    name: I23 · WebKit Chromium · no false independent-custody claims
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright LAB exclusivamente
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.65.0
      - name: WebKit Linux móvil emulado
        run: ./node_modules/.bin/playwright install --with-deps webkit
      - name: Pruebas A/B/C sin red exterior y sin operaciones reales
        run: node tests/i23-external-evidence-browser.test.cjs
